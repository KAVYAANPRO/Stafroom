<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Evaluation — Staffroom</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Sans+Devanagari:wght@400;500;600&family=Source+Serif+4:ital,opsz,wght@0,8..60,400..700;1,8..60,400..600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<style>
  .ev-drop { border: 1.5px dashed #DCD5C3; border-radius: 10px; padding: 22px; text-align: center; background: #FBF9F2; cursor: pointer; transition: border-color .15s, background .15s; }
  .ev-drop.drag { border-color: #0F4C4F; background: #E6EFEE; }
  .ev-conf-bar { height: 5px; border-radius: 99px; background: #E4DECD; overflow: hidden; width: 100%; }
  .ev-row { display: flex; align-items: center; gap: 12px; padding: 10px 14px; border-bottom: 1px solid #E4DECD; }
  .ev-row:last-child { border-bottom: none; }
  .ev-row:hover { background: #FBF9F2; cursor: pointer; }
  .ev-status { font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 99px; flex-shrink: 0; }

  @media (max-width: 480px) {
    .ev-queue-filename { display: none; }
  }
</style>
</head>
<body>
<div id="app"></div>
<script src="shared.js"></script>
<script>
(async () => {
  const { user, main } = await mountShell('evaluator', 'Evaluation');
  main.classList.add('wide');

  if (user.plan !== 'Max') {
    main.innerHTML = `
      <div style="display:flex;flex-direction:column;gap:3px;">
        <h1 class="sr-title">Evaluation</h1>
        <p class="sr-subtitle">Upload answer sheets — AI reads and grades them against your paper.</p>
      </div>
      <div class="sr-card" style="padding:32px;display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center;">
        <span style="font-size:11px;font-weight:600;letter-spacing:0.08em;color:#8A8272;">MAX PLAN FEATURE</span>
        <h2 style="margin:0;font-family:'Source Serif 4',serif;font-size:20px;font-weight:600;color:#0F4C4F;">Upgrade to Max to use Evaluation</h2>
        <p style="margin:0;max-width:440px;font-size:13.5px;color:#6E675C;line-height:1.55;">Photo/PDF grading, weak-concept detection and the full remediation loop are part of the Max plan.</p>
        <a href="credits.html" class="sr-btn-primary" style="text-decoration:none;margin-top:6px;">View plans</a>
      </div>`;
    return;
  }

  let nextLocalId = 1;
  const state = {
    classes: [], classId: null,
    assessments: [], assessmentId: null,
    reviewQueue: [],
    customMode: false, customFile: null, customTitle: '', customDragOver: false, extracting: false,
    uploadQueue: [], // {localId, file, studentName, status, error}
    evaluatingAll: false,
    results: [], resultsLoading: false,
    detail: null // {result, student, assessment, items, studentAnalytics}
  };

  async function boot() {
    const [{ classes }, { queue }] = await Promise.all([api('/classes'), api('/evaluations/queue')]);
    state.classes = classes;
    state.reviewQueue = queue;
    if (!state.classId && classes.length) state.classId = classes[0].id;
    if (state.classId) await loadAssessments();
    render();
  }

  async function loadAssessments() {
    const { assessments } = await api(`/assessments?classId=${state.classId}`);
    state.assessments = assessments.filter((a) => a.status !== 'Draft');
    state.assessmentId = state.assessments[0]?.id || null;
    state.uploadQueue = [];
    if (state.assessmentId) await loadResults();
    else state.results = [];
  }

  async function loadResults() {
    if (!state.assessmentId) { state.results = []; return; }
    state.resultsLoading = true;
    const { results } = await api(`/evaluations?assessmentId=${state.assessmentId}`);
    state.results = results;
    state.resultsLoading = false;
  }

  function selClass() { return state.classes.find((c) => c.id === state.classId); }
  function selAssessment() { return state.assessments.find((a) => a.id === state.assessmentId); }

  function render() {
    const cls = selClass();
    const asm = selAssessment();

    main.innerHTML = `
      <div style="display:flex;flex-direction:column;gap:3px;">
        <h1 class="sr-title">Evaluation</h1>
        <p class="sr-subtitle">Pick a class and paper, upload answer sheets, and let AI grade them.</p>
      </div>

      ${state.reviewQueue.length ? `
      <section style="display:flex;flex-direction:column;gap:10px;">
        <span style="font-size:11px;font-weight:600;letter-spacing:0.09em;color:#8A8272;">NEEDS YOUR REVIEW — LOW AI CONFIDENCE</span>
        <div class="sr-card" style="overflow:hidden;">
          ${state.reviewQueue.map((q) => `
            <div class="ev-row" data-open-detail="${q.id}">
              <div style="flex:1;display:flex;flex-direction:column;gap:1px;">
                <span style="font-size:13.5px;font-weight:600;color:#2B2B2B;">${esc(q.student_name)} · ${esc(q.title)}</span>
                <span style="font-size:12px;color:#8A8272;">${q.max_score ? Math.round((q.score / q.max_score) * 100) + '%' : '—'} · confidence ${Math.round((q.ai_confidence || 0) * 100)}%</span>
              </div>
              <span style="font-size:12px;color:#8A8272;">→</span>
            </div>`).join('')}
        </div>
      </section>` : ''}

      <section class="sr-card" style="padding:20px 22px;display:flex;flex-direction:column;gap:16px;">
        <span style="font-size:11px;font-weight:600;letter-spacing:0.09em;color:#8A8272;">1. CLASS &amp; PAPER</span>
        <div class="sr-grid-collapse" style="display:grid;grid-template-columns:1fr 1fr;gap:12px;">
          <div class="sr-field">
            <span class="label">Class</span>
            <select id="evClass">
              ${state.classes.length ? state.classes.map((c) => `<option value="${c.id}" ${c.id === state.classId ? 'selected' : ''}>${esc(c.key)} · ${esc(c.subject)}</option>`).join('') : '<option>No classes yet</option>'}
            </select>
          </div>
          <div class="sr-field">
            <span class="label">Assessment</span>
            <select id="evAssessment" ${state.customMode ? 'disabled' : ''}>
              ${state.assessments.length ? state.assessments.map((a) => `<option value="${a.id}" ${a.id === state.assessmentId ? 'selected' : ''}>${esc(a.title)} · ${esc(a.status)}</option>`).join('') : '<option>No papers for this class yet</option>'}
            </select>
          </div>
        </div>

        <button id="evToggleCustom" class="sr-btn-secondary" style="align-self:flex-start;">${state.customMode ? '← Use an existing paper instead' : 'Or upload your own question paper →'}</button>

        ${state.customMode ? `
        <div style="display:flex;flex-direction:column;gap:10px;padding-top:4px;border-top:1px solid #E4DECD;">
          <div class="sr-field"><span class="label">Paper title (optional)</span><input type="text" id="evCustomTitle" placeholder="e.g. Unit Test 3" value="${esc(state.customTitle)}"></div>
          <div id="evCustomDrop" class="ev-drop${state.customDragOver ? ' drag' : ''}">
            <input type="file" id="evCustomFile" accept="image/jpeg,image/png,image/webp,image/heic,image/heif,application/pdf" style="display:none;">
            ${state.customFile
              ? `<span style="font-size:13.5px;font-weight:600;color:#2B2B2B;">${esc(state.customFile.name)}</span>`
              : `<span style="font-size:13.5px;color:#2B2B2B;font-weight:600;">Drop the question paper here, or click to choose</span><br><span style="font-size:12px;color:#8A8272;">JPEG, PNG, WEBP, HEIC or PDF</span>`}
          </div>
          <button id="evExtract" class="sr-btn-primary" style="align-self:flex-start;" ${state.extracting ? 'disabled' : ''}>${state.extracting ? 'Reading paper…' : 'Read this paper (≈2 credits)'}</button>
        </div>` : ''}
      </section>

      ${asm ? `
      <section class="sr-card" style="padding:20px 22px;display:flex;flex-direction:column;gap:14px;">
        <span style="font-size:11px;font-weight:600;letter-spacing:0.09em;color:#8A8272;">2. UPLOAD ANSWER SHEETS</span>
        <div id="evSheetsDrop" class="ev-drop">
          <input type="file" id="evSheetsFile" multiple accept="image/jpeg,image/png,image/webp,image/heic,image/heif,application/pdf" style="display:none;">
          <span style="font-size:13.5px;color:#2B2B2B;font-weight:600;">Drop one or more photos/PDFs here, or click to choose</span><br>
          <span style="font-size:12px;color:#8A8272;">Select multiple files at once for a whole class · up to 15MB each</span>
        </div>

        ${state.uploadQueue.length ? `
        <div style="display:flex;flex-direction:column;gap:8px;">
          <span style="font-size:11px;font-weight:600;letter-spacing:0.09em;color:#8A8272;">UNCHECKED (${state.uploadQueue.filter((q) => q.status === 'pending').length})</span>
          <div class="sr-card" style="overflow:hidden;">
            ${state.uploadQueue.map((q) => `
              <div class="ev-row ev-queue-row" style="cursor:default;">
                <input type="text" data-queue-name="${q.localId}" value="${esc(q.studentName)}" placeholder="Student name" style="flex:1;min-width:0;border:1px solid #DCD5C3;border-radius:6px;padding:6px 9px;font-size:13px;font-family:inherit;" ${q.status !== 'pending' ? 'disabled' : ''}>
                <span class="ev-queue-filename" style="font-size:12px;color:#8A8272;flex-shrink:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:110px;">${esc(q.file.name)}</span>
                <span class="ev-status" style="background:${statusColor(q.status)[0]};color:${statusColor(q.status)[1]};">${statusLabel(q.status)}</span>
                ${q.status === 'pending' ? `<button data-queue-remove="${q.localId}" style="background:none;border:none;color:#A2593F;cursor:pointer;font-size:14px;flex-shrink:0;">✕</button>` : ''}
              </div>`).join('')}
          </div>
          <button id="evEvaluateAll" class="sr-btn-primary" style="align-self:flex-start;" ${state.evaluatingAll || !state.uploadQueue.some((q) => q.status === 'pending') ? 'disabled' : ''}>
            ${state.evaluatingAll ? 'Evaluating…' : `Evaluate all (≈${(state.uploadQueue.filter((q) => q.status === 'pending').length * 1.5).toFixed(1)} credits)`}
          </button>
        </div>` : ''}
      </section>

      <section style="display:flex;flex-direction:column;gap:10px;">
        <span style="font-size:11px;font-weight:600;letter-spacing:0.09em;color:#8A8272;">3. RESULTS — ${esc(asm.title)}</span>
        <div class="sr-card" style="overflow:hidden;">
          ${state.resultsLoading ? `<div style="padding:16px;font-size:13px;color:#8A8272;">Loading…</div>` :
            state.results.length ? state.results.map((r) => `
            <div class="ev-row" data-open-result="${r.id}">
              <div style="flex:1;display:flex;flex-direction:column;gap:1px;">
                <span style="font-size:13.5px;font-weight:600;color:#2B2B2B;">${esc(r.studentName)}</span>
                ${r.needsReview ? `<span style="font-size:11px;color:#A2593F;">Needs review</span>` : ''}
              </div>
              <span style="font-family:'Source Serif 4',serif;font-size:15px;font-weight:600;color:#0F4C4F;">${r.score} / ${r.maxScore}</span>
              <span style="font-size:12px;color:#8A8272;">→</span>
            </div>`).join('') : `<div style="padding:16px;font-size:13px;color:#8A8272;">No sheets evaluated yet for this paper.</div>`}
        </div>
      </section>` : `<div class="sr-card" style="padding:20px;font-size:13.5px;color:#8A8272;">Pick or upload a paper above to start evaluating sheets.</div>`}

      ${state.detail ? renderDetail() : ''}
    `;
    wire();
  }

  function statusColor(status) {
    if (status === 'done') return ['#EDF1ED', '#3E5240'];
    if (status === 'error') return ['#F7E9E4', '#A2593F'];
    if (status === 'evaluating') return ['#F6EDD4', '#8C6A1E'];
    return ['#EFEADD', '#6E675C'];
  }
  function statusLabel(status) {
    return { pending: 'Unchecked', evaluating: 'Evaluating…', done: 'Evaluated', error: 'Failed' }[status] || status;
  }

  function renderDetail() {
    const d = state.detail;
    return `
      <section class="sr-card" style="padding:20px 22px;display:flex;flex-direction:column;gap:16px;animation:rise .2s ease;">
        <div style="display:flex;align-items:baseline;justify-content:space-between;">
          <div style="display:flex;flex-direction:column;gap:2px;">
            <span style="font-family:'Source Serif 4',serif;font-size:18px;font-weight:600;color:#0F4C4F;">${esc(d.student.name)}</span>
            <span style="font-size:12.5px;color:#6E675C;">${esc(d.assessment.title)}</span>
          </div>
          <div style="display:flex;align-items:center;gap:12px;">
            <span style="font-family:'Source Serif 4',serif;font-size:20px;font-weight:600;color:#0F4C4F;">${d.result.score} / ${d.result.maxScore}</span>
            <button id="evCloseDetail" class="sr-btn-secondary">Close</button>
          </div>
        </div>

        ${d.studentAnalytics ? `
        <div style="display:flex;gap:16px;padding:12px 14px;background:#F5F2E9;border-radius:8px;">
          <div style="display:flex;flex-direction:column;gap:1px;"><span style="font-size:11px;color:#8A8272;">OVERALL AVERAGE</span><span style="font-size:15px;font-weight:600;color:#2B2B2B;">${esc(d.studentAnalytics.avg)}</span></div>
          <div style="display:flex;flex-direction:column;gap:1px;flex:1;"><span style="font-size:11px;color:#8A8272;">WEAKEST TOPIC</span><span style="font-size:15px;font-weight:600;color:#2B2B2B;">${d.studentAnalytics.topics?.[0] ? esc(d.studentAnalytics.topics[0].name) + ' · ' + d.studentAnalytics.topics[0].pct + '%' : '—'}</span></div>
          <a href="analytics.html?student=${d.student.id}" style="align-self:center;font-size:12.5px;font-weight:600;">Full analytics →</a>
        </div>` : ''}

        <div style="display:flex;flex-direction:column;gap:10px;">
          ${d.items.map((it) => `
            <div style="display:flex;flex-direction:column;gap:5px;padding:11px 13px;background:#F5F2E9;border-radius:8px;">
              <div style="display:flex;align-items:center;gap:8px;">
                <span style="font-size:12.5px;font-weight:600;color:#2B2B2B;flex:1;">Q${it.position || ''}${it.topic ? ' — ' + esc(it.topic) : ''}</span>
                <input data-detail-award="${it.aqId}" type="number" min="0" max="${it.max}" step="0.5" value="${it.awarded}" style="width:52px;border:1px solid #DCD5C3;border-radius:6px;padding:4px 6px;font-size:12.5px;text-align:right;">
                <span style="font-size:12.5px;color:#8A8272;">/ ${it.max}</span>
              </div>
              ${it.question ? `<span style="font-size:12px;color:#6E675C;">${esc(it.question.slice(0, 140))}${it.question.length > 140 ? '…' : ''}</span>` : ''}
              <span style="font-size:12px;color:#8A8272;">${esc(it.comment || '')}</span>
              <div style="display:flex;align-items:center;gap:6px;">
                <div class="ev-conf-bar"><div style="height:5px;background:${it.confidence < 0.7 ? '#C1654B' : '#6E8B6F'};width:${Math.round(it.confidence * 100)}%;"></div></div>
                <span style="font-size:10.5px;color:#8A8272;flex-shrink:0;">${Math.round(it.confidence * 100)}% confident</span>
              </div>
            </div>`).join('')}
        </div>
        <div style="display:flex;justify-content:flex-end;">
          <button id="evSaveDetail" class="sr-btn-primary">Save corrections</button>
        </div>
      </section>`;
  }

  function wire() {
    const classSel = document.getElementById('evClass');
    if (classSel) classSel.onchange = async (e) => { state.classId = e.target.value; state.detail = null; await loadAssessments(); render(); };
    const asmSel = document.getElementById('evAssessment');
    if (asmSel) asmSel.onchange = async (e) => { state.assessmentId = e.target.value; state.uploadQueue = []; state.detail = null; await loadResults(); render(); };

    const toggleCustom = document.getElementById('evToggleCustom');
    if (toggleCustom) toggleCustom.onclick = () => { state.customMode = !state.customMode; render(); };

    if (state.customMode) {
      const titleInput = document.getElementById('evCustomTitle');
      if (titleInput) titleInput.oninput = (e) => { state.customTitle = e.target.value; };
      const drop = document.getElementById('evCustomDrop');
      const fileInput = document.getElementById('evCustomFile');
      drop.onclick = () => fileInput.click();
      fileInput.onchange = (e) => { state.customFile = e.target.files[0] || null; render(); };
      drop.addEventListener('dragover', (e) => { e.preventDefault(); if (!state.customDragOver) { state.customDragOver = true; render(); } });
      drop.addEventListener('dragleave', () => { state.customDragOver = false; render(); });
      drop.addEventListener('drop', (e) => { e.preventDefault(); state.customDragOver = false; const f = e.dataTransfer.files[0]; if (f) { state.customFile = f; render(); } });
      document.getElementById('evExtract').onclick = extractCustomPaper;
    }

    const sheetsDrop = document.getElementById('evSheetsDrop');
    if (sheetsDrop) {
      const sheetsInput = document.getElementById('evSheetsFile');
      sheetsDrop.onclick = () => sheetsInput.click();
      sheetsInput.onchange = (e) => { addToQueue([...e.target.files]); e.target.value = ''; };
      sheetsDrop.addEventListener('dragover', (e) => { e.preventDefault(); sheetsDrop.classList.add('drag'); });
      sheetsDrop.addEventListener('dragleave', () => sheetsDrop.classList.remove('drag'));
      sheetsDrop.addEventListener('drop', (e) => { e.preventDefault(); sheetsDrop.classList.remove('drag'); addToQueue([...e.dataTransfer.files]); });
    }

    main.querySelectorAll('[data-queue-name]').forEach((el) => el.oninput = (e) => {
      const item = state.uploadQueue.find((q) => String(q.localId) === el.dataset.queueName);
      if (item) item.studentName = e.target.value;
    });
    main.querySelectorAll('[data-queue-remove]').forEach((el) => el.onclick = () => {
      state.uploadQueue = state.uploadQueue.filter((q) => String(q.localId) !== el.dataset.queueRemove);
      render();
    });
    const evalAllBtn = document.getElementById('evEvaluateAll');
    if (evalAllBtn) evalAllBtn.onclick = evaluateAll;

    main.querySelectorAll('[data-open-result]').forEach((el) => el.onclick = () => openDetail(el.dataset.openResult));
    main.querySelectorAll('[data-open-detail]').forEach((el) => el.onclick = () => openDetail(el.dataset.openDetail));

    const closeBtn = document.getElementById('evCloseDetail');
    if (closeBtn) closeBtn.onclick = () => { state.detail = null; render(); };
    const saveDetailBtn = document.getElementById('evSaveDetail');
    if (saveDetailBtn) saveDetailBtn.onclick = saveDetailCorrections;
  }

  function cleanName(filename) {
    return filename.replace(/\.[^.]+$/, '').replace(/[_-]+/g, ' ').trim();
  }

  function addToQueue(files) {
    for (const file of files) {
      state.uploadQueue.push({ localId: nextLocalId++, file, studentName: cleanName(file.name), status: 'pending' });
    }
    render();
  }

  async function evaluateAll() {
    state.evaluatingAll = true; render();
    for (const item of state.uploadQueue) {
      if (item.status !== 'pending') continue;
      item.status = 'evaluating'; render();
      try {
        const form = new FormData();
        form.append('assessmentId', state.assessmentId);
        form.append('studentName', item.studentName.trim() || cleanName(item.file.name));
        form.append('file', item.file);
        const res = await apiUpload('/evaluations/upload', form);
        if (res.refunded) {
          item.status = 'error'; item.error = res.error;
        } else {
          item.status = 'done';
          refreshCreditChips(res.balance);
        }
      } catch (e) {
        item.status = 'error'; item.error = e.message;
      }
      render();
    }
    state.evaluatingAll = false;
    await loadResults();
    const q = await api('/evaluations/queue');
    state.reviewQueue = q.queue;
    render();
    toast('Batch evaluation complete');
  }

  async function extractCustomPaper() {
    if (!state.customFile) return toast('Choose a file first');
    state.extracting = true; render();
    try {
      const form = new FormData();
      if (state.classId) form.append('classId', state.classId);
      if (state.customTitle.trim()) form.append('title', state.customTitle.trim());
      form.append('file', state.customFile);
      const res = await apiUpload('/evaluations/from-paper', form);
      if (res.refunded) {
        toast(res.error);
      } else {
        refreshCreditChips(res.balance);
        toast(`Read ${res.questionCount} questions from the paper`);
        await loadAssessments();
        state.assessmentId = res.assessment.id;
        await loadResults();
        state.customMode = false; state.customFile = null; state.customTitle = '';
      }
    } catch (e) { errorToast(e); }
    state.extracting = false;
    render();
  }

  async function openDetail(resultId) {
    try {
      const d = await api(`/evaluations/${resultId}/detail`);
      let studentAnalytics = null;
      try { studentAnalytics = await api(`/analytics/students/${d.student.id}`); } catch { /* Analytics may be unavailable — detail still works without it */ }
      state.detail = { ...d, studentAnalytics };
      render();
    } catch (e) { errorToast(e); }
  }

  async function saveDetailCorrections() {
    const d = state.detail;
    if (!d) return;
    const items = d.items.map((it) => {
      const input = document.querySelector(`[data-detail-award="${it.aqId}"]`);
      return { aqId: it.aqId, awarded: input ? Number(input.value) || 0 : it.awarded };
    });
    try {
      await api(`/evaluations/${d.result.id}/review`, { method: 'POST', body: { items } });
      toast('Saved');
      state.detail = null;
      await loadResults();
      const q = await api('/evaluations/queue');
      state.reviewQueue = q.queue;
      render();
    } catch (e) { errorToast(e); }
  }

  await boot();
})();
</script>
</body>
</html>
