<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Sign in — Staffroom</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Sans+Devanagari:wght@400;500;600&family=Source+Serif+4:ital,opsz,wght@0,8..60,400..700;1,8..60,400..600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<style>
  body { min-height: 100vh; display: flex; align-items: center; justify-content: center; }
  .auth-card { width: 380px; max-width: calc(100vw - 32px); background: #FFFFFF; border: 1px solid #DCD5C3; border-radius: 14px; padding: 28px; display: flex; flex-direction: column; gap: 16px; box-shadow: 0 20px 50px rgba(15,76,79,0.08); }
  .auth-brand { display: flex; align-items: center; gap: 9px; }
  .auth-tabs { display: inline-flex; border: 1px solid #DCD5C3; border-radius: 8px; overflow: hidden; background: #F5F2E9; }
  .auth-tabs button { flex: 1; padding: 8px; font-size: 13px; border: none; background: transparent; color: #4A4437; cursor: pointer; }
  .auth-tabs button.active { background: #0F4C4F; color: #F5F2E9; font-weight: 600; }
  .auth-err { font-size: 12.5px; color: #A2593F; background: #F7E9E4; border: 1px solid #EAD1C9; border-radius: 7px; padding: 8px 10px; display: none; }
  .auth-hint { font-size: 12px; color: #8A8272; text-align: center; }
</style>
</head>
<body>
<div class="auth-card">
  <div class="auth-brand">
    <svg width="20" height="20" viewBox="0 0 18 18"><rect x="1.5" y="2" width="15" height="3.2" rx="1.6" fill="#0F4C4F" opacity="0.4"></rect><rect x="1.5" y="7" width="15" height="3.2" rx="1.6" fill="#0F4C4F" opacity="0.68"></rect><rect x="1.5" y="12" width="15" height="3.2" rx="1.6" fill="#0F4C4F"></rect></svg>
    <span style="font-family:'Source Serif 4',serif;font-size:19px;font-weight:600;color:#0F4C4F;">Staffroom</span>
  </div>

  <div class="auth-tabs">
    <button id="tabLogin" class="active">Sign in</button>
    <button id="tabRegister">Create account</button>
  </div>

  <div class="auth-err" id="err"></div>

  <form id="formLogin" style="display:flex;flex-direction:column;gap:10px;">
    <div class="sr-field"><span class="label">Email</span><input type="email" id="loginEmail" required autocomplete="email"></div>
    <div class="sr-field"><span class="label">Password</span><input type="password" id="loginPassword" required autocomplete="current-password"></div>
    <button type="submit" class="sr-btn-primary" style="margin-top:4px;">Sign in</button>
  </form>

  <form id="formRegister" style="display:none;flex-direction:column;gap:10px;">
    <div class="sr-field"><span class="label">Full name</span><input type="text" id="regName" required></div>
    <div class="sr-field"><span class="label">School</span><input type="text" id="regSchool"></div>
    <div class="sr-field"><span class="label">Email</span><input type="email" id="regEmail" required></div>
    <div class="sr-field">
      <span class="label">Password</span>
      <input type="password" id="regPassword" required minlength="8" pattern="(?=.*[a-z])(?=.*[A-Z])(?=.*\d).{8,}">
      <span class="auth-hint" style="text-align:left;">At least 8 characters, with one uppercase letter, one lowercase letter and one number.</span>
    </div>
    <button type="submit" class="sr-btn-primary" style="margin-top:4px;">Create account</button>
    <span class="auth-hint">Free plan · 100 credits/month · no credit card</span>
  </form>
</div>
<script src="shared.js"></script>
<script>
  const params = new URLSearchParams(location.search);
  const next = params.get('next') || 'dashboard.html';

  const tabLogin = document.getElementById('tabLogin');
  const tabRegister = document.getElementById('tabRegister');
  const formLogin = document.getElementById('formLogin');
  const formRegister = document.getElementById('formRegister');
  const err = document.getElementById('err');

  tabLogin.onclick = () => { tabLogin.classList.add('active'); tabRegister.classList.remove('active'); formLogin.style.display = 'flex'; formRegister.style.display = 'none'; err.style.display = 'none'; };
  tabRegister.onclick = () => { tabRegister.classList.add('active'); tabLogin.classList.remove('active'); formRegister.style.display = 'flex'; formLogin.style.display = 'none'; err.style.display = 'none'; };

  function showErr(msg) { err.textContent = msg; err.style.display = 'block'; }

  const EMAIL_RE = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
  function passwordIssue(pw) {
    if (!pw || pw.length < 8) return 'Password must be at least 8 characters';
    if (!/[A-Z]/.test(pw)) return 'Password must include at least one uppercase letter';
    if (!/[a-z]/.test(pw)) return 'Password must include at least one lowercase letter';
    if (!/[0-9]/.test(pw)) return 'Password must include at least one number';
    return null;
  }

  formLogin.addEventListener('submit', async (e) => {
    e.preventDefault();
    err.style.display = 'none';
    try {
      const data = await api('/auth/login', { method: 'POST', body: { email: loginEmail.value, password: loginPassword.value } });
      setToken(data.token);
      location.href = next;
    } catch (ex) { showErr(ex.message); }
  });

  formRegister.addEventListener('submit', async (e) => {
    e.preventDefault();
    err.style.display = 'none';
    if (!EMAIL_RE.test(regEmail.value.trim())) return showErr('Enter a valid email address');
    const pwIssue = passwordIssue(regPassword.value);
    if (pwIssue) return showErr(pwIssue);
    try {
      const data = await api('/auth/register', { method: 'POST', body: { name: regName.value, school: regSchool.value, email: regEmail.value, password: regPassword.value } });
      setToken(data.token);
      location.href = next;
    } catch (ex) { showErr(ex.message); }
  });

  // Already signed in? Skip straight past the login form.
  if (getToken()) api('/auth/me').then(() => { location.href = next; }).catch(() => {});
</script>
</body>
</html>
